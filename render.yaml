services:
  - type: web
    name: yt-channel-downloader
    runtime: node
    plan: free
    repo: https://github.com/divyanet/yt-channel-downloader
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
